
    <body>
        <h2>User Table</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Gender</th>
                    <th>Email ID</th>
                    <th>Phone No</th>
                    <th>Birth Date</th>
                    <th>Image</th>
                    <th>Edit</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of userDetails">
                    <td>{{user.id}}</td>
                    <td>{{user.firstName}}</td>
                    <td>{{user.lastName}}</td>
                    <td>{{user.gender | titlecase}}</td>
                    <td>{{user.email}}</td>
                    <td>{{user.phone}}</td>
                    <td>{{user.birthDate | date}}</td>
                    <td><img class="image" *ngIf="user?.image" [src]="user?.image" class="profile-img"></td>
                    <td><button class="edit-btn">Edit</button></td>
                    <td><button class="details-btn">View Details</button></td>
                </tr>
            </tbody>
        </table>
    </body>
